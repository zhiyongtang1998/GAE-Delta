[build-system]
requires = [
    "setuptools>=65.0",
    "wheel",
    "Cython>=3.0",
    # Build the Cython extensions against numpy 2.x: the resulting binaries are
    # runtime-compatible with numpy >=1.23 as well (numpy 2.0 ABI policy).
    "numpy>=2.0",
    "pybind11>=2.10",
]
build-backend = "setuptools.build_meta"

[project]
name = "gae-delta"
dynamic = ["version"]
description = "GAE-Δ: Phenotype-specific gene role shifts in multi-omics data via graph autoencoder embedding differences"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "GAE-Delta Authors"},
]
# Lower bounds only — the project runs on the current scientific Python stack
# (verified against torch 2.8 / numpy 2.0). No artificial upper caps.
dependencies = [
    "torch>=2.0",
    "torch-geometric>=2.4",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "pandas>=2.0",
    "h5py>=3.8",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tqdm",
]

[project.scripts]
gae-delta = "gae_delta.pipeline.runner:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
vis = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[tool.setuptools.dynamic]
version = {attr = "gae_delta._version.__version__"}

[tool.setuptools.packages.find]
include = ["gae_delta*"]

# Ship the Hydra config tree inside the wheel so the installed `gae-delta`
# command can locate configs/ relative to the package (see runner.py).
[tool.setuptools.package-data]
gae_delta = ["configs/*.yaml", "configs/**/*.yaml"]
