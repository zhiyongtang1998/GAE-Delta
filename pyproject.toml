[build-system]
requires = [
    "setuptools>=65.0",
    "wheel",
    "Cython>=3.0",
    # Build the Cython extensions against numpy 2.x: the resulting binaries are
    # runtime-compatible with numpy >=1.23 as well (numpy 2.0 ABI policy).
    "numpy>=2.0",
    "pybind11>=2.10",
]
build-backend = "setuptools.build_meta"

[project]
name = "gae-delta"
dynamic = ["version"]
description = "GAE-Δ: Phenotype-specific gene role shifts in multi-omics data via graph autoencoder embedding differences"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "GAE-Delta Authors"},
]
keywords = ["multi-omics", "graph-autoencoder", "cancer-genomics", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
# Lower bounds only — the project runs on the current scientific Python stack
# (verified against torch 2.8 / numpy 2.0). No artificial upper caps.
dependencies = [
    "torch>=2.0",
    "torch-geometric>=2.4",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "pandas>=2.0",
    "h5py>=3.8",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/zhiyongtang1998/GAE-Delta"
Repository = "https://github.com/zhiyongtang1998/GAE-Delta"
Issues = "https://github.com/zhiyongtang1998/GAE-Delta/issues"

[project.scripts]
gae-delta = "gae_delta.pipeline.runner:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
vis = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[tool.setuptools.dynamic]
version = {attr = "gae_delta._version.__version__"}

[tool.setuptools.packages.find]
include = ["gae_delta*"]

# Ship the Hydra config tree inside the wheel so the installed `gae-delta`
# command can locate configs/ relative to the package (see runner.py).
[tool.setuptools.package-data]
gae_delta = ["configs/*.yaml", "configs/**/*.yaml"]

[tool.cibuildwheel]
# Build CPython wheels only; skip PyPy, musllinux, and 32-bit targets.
skip = "pp* *-musllinux_* *_i686 *-win32"
build-verbosity = 1
# No in-CI test step: installing the wheel would pull in torch / torch-geometric
# (very heavy, and not needed to validate the compiled extensions). Run the test
# suite separately (`make test`) in a full environment.

[tool.cibuildwheel.macos]
# Build for both Intel and Apple Silicon.
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]
