name: gae-delta
channels:
  - pytorch
  - pyg
  - conda-forge
dependencies:
  - python>=3.10
  - pytorch>=2.0       # CPU build by default; see README for the CUDA variant
  - pyg>=2.5
  - numpy>=1.24
  - scipy>=1.10
  - scikit-learn>=1.2
  - pandas>=2.0
  - h5py>=3.8
  - cython>=3.0
  - pybind11>=2.10
  - cmake>=3.18        # only needed for the optional `make` dev build
  - matplotlib>=3.7
  - seaborn>=0.12
  - tqdm
  - pip
  - pip:
      - hydra-core>=1.3
      - omegaconf>=2.3
      - pytest>=7.0

# NVIDIA GPU: after creating the env, install a CUDA build of PyTorch following
# https://pytorch.org/get-started/locally/ (e.g. `conda install pytorch
# pytorch-cuda=12.1 -c pytorch -c nvidia`). The default env above is CPU-only so
# it also works on macOS / machines without an NVIDIA card.
